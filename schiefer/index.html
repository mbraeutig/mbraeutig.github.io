<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Ein Blatt statt Notizarchiv: schreiben, weitergeben, wegwischen."

    <title>Schiefer</title>
    <link rel="icon" href="/schiefer/icons/favicon.ico" sizes="48x48" />

    <link rel="apple-touch-icon" href="/schiefer/icons/apple-touch-icon-180x180.png" />
    <script type="module" crossorigin src="/schiefer/assets/index-DrMFTdT6.js"></script>
    <link rel="stylesheet" crossorigin href="/schiefer/assets/index-DWllqnaF.css">

  <body class="bg-stone-50 text-slate-800 dark:bg-slate-900 dark:text-slate-50">
    <main class="flex h-dvh flex-col">
      <div
        id="writer-banner"
        role="status"
        class="flex flex-wrap items-center justify-center gap-x-2 border-b border-slate-300 bg-stone-100 px-4 py-1 text-sm text-slate-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300"
        hidden
      ></div>
      <textarea
        id="sheet"
        class="flex-1 resize-none bg-transparent p-4 font-mono text-base leading-relaxed outline-none placeholder:text-slate-500 read-only:text-slate-600 dark:placeholder:text-slate-400 dark:read-only:text-slate-300 sm:p-8"
        spellcheck="true"
        autocomplete="off"
      ></textarea>
      <div
        id="bar"
        role="group"
        class="flex items-center gap-1 border-t border-slate-300 px-2 pt-1 pb-[max(0.25rem,env(safe-area-inset-bottom))] dark:border-slate-700"
      ></div>
    </main>
    <div
      id="toast"
      aria-live="polite"
      class="pointer-events-none fixed inset-x-0 bottom-16 z-10 flex justify-center px-4"
    ></div>
  </body>
</html>
