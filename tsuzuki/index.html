<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<meta name="description" content="Tsuzuki — ein ruhiges Micro-Tagebuch. Kein Streak, kein Zwang.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tsuzuki">
<title>Tsuzuki 続き</title>
<style>
  :root{
    --ink:#1c1b1a; --paper:#f3efe6; --paper-deep:#ebe5d8; --card:#faf7f0;
    /* Kontrast ≥ 4,5:1 auf Papier und Karte (WCAG AA) — im Farbton der ursprünglichen Töne */
    --ai:#3a4a6b; --ai-soft:#5f6b84; --fade:#716c5f; --tag:#7d6336;
    /* Nur Systemschriften (kein Netz). Noto-Namen: Rückfall für Android/Linux. */
    --serif:'Iowan Old Style','Palatino Linotype',Georgia,'Noto Serif',serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono','Noto Sans Mono',monospace;
    --mincho:'Hiragino Mincho ProN','Yu Mincho','Noto Serif CJK JP','Noto Serif JP','Source Han Serif JP',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--serif);}
  body{min-height:100dvh;}
  .shell{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  header{display:flex;justify-content:space-between;align-items:center;
    padding:18px 22px 10px;border-bottom:1px solid var(--paper-deep);}
  .brand{display:flex;align-items:baseline;gap:9px;}
  .mark{font-size:22px;color:var(--ai);font-weight:600;font-family:var(--mincho);}
  .brand-text{font-size:17px;letter-spacing:1.5px;font-weight:600;}
  .head-meta{font-size:11px;color:var(--fade);letter-spacing:.5px;font-family:var(--mono);}
  main{flex:1;padding:26px 22px 100px;overflow-y:auto;}

  .fade-in{animation:fade .5s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.fade-in{animation:none;}}

  /* write */
  .date-line{font-size:11.5px;letter-spacing:1px;color:var(--fade);font-family:var(--mono);
    margin-bottom:18px;display:flex;align-items:center;gap:10px;}
  /* 44×44-px-Tippfläche; negative Ränder halten die Zeile optisch so schmal wie zuvor */
  .date-nav{background:none;border:none;color:var(--ai-soft);font-size:16px;cursor:pointer;
    min-width:44px;min-height:44px;margin:-13px -8px;padding:0;font-family:var(--mono);
    display:inline-flex;align-items:center;justify-content:center;}
  .date-nav:first-child{margin-left:-15px;}
  .date-nav:disabled{opacity:.25;cursor:default;}
  .prompt{font-size:21px;line-height:1.4;color:var(--ai);margin-bottom:20px;font-style:italic;}
  textarea{width:100%;min-height:200px;border:none;outline:none;background:transparent;resize:none;
    color:var(--ink);font-size:18px;line-height:1.7;font-family:var(--serif);caret-color:var(--ai);}
  textarea::placeholder{color:var(--fade);}
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .chip-row:empty{display:none;}
  .chip{font-size:13px;padding:3px 9px;border-radius:2px;font-family:var(--mono);}
  .chip.person{color:var(--ai);background:#e7ebf2;}
  .chip.tag{color:var(--tag);background:#f0e9dc;}
  .write-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;
    padding-top:16px;border-top:1px solid var(--paper-deep);}
  .word-count{font-size:12px;color:var(--fade);font-family:var(--mono);}
  .save-btn{background:var(--ink);color:var(--paper);border:none;border-radius:2px;padding:11px 22px;
    font-size:14px;letter-spacing:.5px;cursor:pointer;font-family:var(--serif);}
  .wabi{margin-top:30px;font-size:13px;line-height:1.6;color:var(--fade);font-style:italic;
    text-align:center;max-width:300px;margin-left:auto;margin-right:auto;}

  /* reflect */
  .stack{display:flex;flex-direction:column;gap:16px;}
  .reflect-greeting{font-size:13px;letter-spacing:.5px;color:var(--fade);font-style:italic;
    margin-bottom:6px;}
  .token-group-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--fade);margin-bottom:9px;}
  .token-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
  .tok-btn{font-size:13.5px;border:none;padding:5px 11px;border-radius:2px;cursor:pointer;
    font-family:var(--mono);display:inline-flex;align-items:center;gap:6px;}
  .tok-btn.person{color:var(--ai);background:#e7ebf2;}
  .tok-btn.tag{color:var(--tag);background:#f0e9dc;}
  .tok-btn.draft{color:var(--ink);background:var(--paper-deep);}
  .tok-more{font-size:12.5px;border:1px solid var(--paper-deep);background:none;color:var(--ai-soft);
    padding:4px 10px;border-radius:2px;cursor:pointer;font-family:var(--mono);}
  .tok-count{font-size:10.5px;}  /* volle Deckkraft — mit .55 lag der Kontrast unter 3:1 */
  .card{background:var(--card);border:1px solid var(--paper-deep);border-radius:3px;padding:18px 20px;}
  .card.accent{border-left:2px solid var(--ai);}
  .card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .card-label{font-size:13px;letter-spacing:1px;font-weight:600;}
  .card-label.accent{color:var(--ai);}
  .card-sub{font-size:11px;color:var(--fade);font-family:var(--mono);}
  .card-body{font-size:16px;line-height:1.65;color:#2e2c29;white-space:pre-wrap;margin:0;}
  /* Innenabstand vergrößert die Tippfläche; negativer Rand verhindert, dass der Text verrutscht */
  .tok{cursor:pointer;font-weight:600;padding:6px 3px;margin:0 -3px;border-radius:2px;}
  .tok.person,.c-person{color:var(--ai);}
  .tok.tag,.c-tag{color:var(--tag);}
  /* Weiterschreiben (続き): ↩-Verweis im Text, Kartenfuß mit leisen Links */
  .tok.ref{color:var(--ai);font-weight:normal;font-style:italic;white-space:nowrap;}
  .ref-arrow{font-style:normal;margin-right:.15em;}
  .chip.ref{color:var(--ink);background:var(--paper-deep);}
  .card-foot{display:flex;align-items:center;gap:14px;margin-top:10px;}
  .card-link{background:none;border:none;padding:0;min-height:44px;margin:-10px 0 -14px;cursor:pointer;
    font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ai-soft);text-align:left;}
  .write-on{margin-left:auto;white-space:nowrap;}
  /* Kartendatum als Link zum Monat — sieht aus wie Text, größere Tippfläche */
  .card-date{background:none;border:none;cursor:pointer;padding:8px 0;margin:-8px 0;}
  /* Zeitraum-Karten (Woche/Monat/Jahr) und Zeitraum-Liste */
  .wk-lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .wk-lines li{display:flex;gap:10px;align-items:baseline;font-size:15px;line-height:1.5;color:#2e2c29;min-width:0;}
  .wk-day{font-family:var(--mono);font-size:11px;color:var(--fade);width:22px;flex-shrink:0;}
  .wk-line{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .wk-tokens{margin:14px 0 0;}
  .period-open{background:none;border:none;padding:0;margin-top:6px;min-height:44px;color:var(--ai);
    font-family:var(--serif);font-style:italic;font-size:14.5px;cursor:pointer;}
  .period-nav{display:flex;align-items:center;gap:10px;}
  .filter-period{font-size:16px;font-weight:600;}
  .cta-write{background:none;border:1px solid var(--paper-deep);border-radius:3px;padding:14px;
    width:100%;color:var(--ai);font-size:15px;font-family:var(--serif);cursor:pointer;font-style:italic;}

  .empty{text-align:center;padding:60px 20px;}
  .empty-mark{font-size:46px;color:var(--paper-deep);margin-bottom:18px;font-family:var(--mincho);}
  .empty-text{font-size:15px;line-height:1.6;color:var(--fade);font-style:italic;}

  .back-btn{align-self:flex-start;background:none;border:none;color:var(--ai-soft);font-size:14px;
    cursor:pointer;font-family:var(--serif);padding:0 16px 0 0;min-height:44px;margin:-12px 0 -8px;
    display:inline-flex;align-items:center;}
  .filter-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;
    border-bottom:1px solid var(--paper-deep);}
  .filter-token{font-size:18px;font-weight:600;font-family:var(--mono);}

  /* nav */
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    display:flex;background:var(--paper);border-top:1px solid var(--paper-deep);
    padding-bottom:env(safe-area-inset-bottom);}
  .nav-btn{flex:1;background:none;border:none;cursor:pointer;padding:12px 0 16px;display:flex;
    flex-direction:column;align-items:center;gap:4px;color:var(--fade);font-family:var(--serif);}
  .nav-btn.active{color:var(--ink);}
  .nav-glyph{font-size:19px;font-family:var(--mincho);}
  .nav-label{font-size:11px;letter-spacing:.3px;}
  button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--ai);outline-offset:2px;}

  .toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:3px;font-size:13px;opacity:0;
    transition:opacity .3s;pointer-events:none;z-index:10;display:flex;align-items:center;gap:14px;
    /* Lange Meldungen (Import-Bilanz) umbrechen statt über den Bildschirmrand laufen */
    width:max-content;max-width:min(440px, calc(100vw - 32px));text-align:center;line-height:1.4;}
  .toast.show{opacity:1;}
  .toast.show.has-action{pointer-events:auto;}
  .toast-action{background:none;border:none;color:var(--paper);font:inherit;text-decoration:underline;
    text-underline-offset:3px;padding:6px 2px;margin:-6px 0;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  input[type=file]{display:none;}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span class="mark">続</span><span class="brand-text">Tsuzuki</span></div>
    <div class="head-meta" id="head-meta">—</div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-input" accept=".md,text/markdown,text/plain">
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
