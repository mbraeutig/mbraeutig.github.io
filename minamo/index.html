<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Minamo</title>
  <base href="/minamo/">
  <!-- resizes-content: the on-screen keyboard shrinks the layout, so the input stays visible -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1B1A" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    // Darstellung chosen in the help, applied before the first paint (no flash of the other colors).
    // Same keys and values as loadTheme() and loadTextSize() in storage.ts; the app takes over from here.
    // The app scrolls to the end of the stream itself; a reload must not put back the old position
    // afterwards (it did now and then, leaving the stream at the top).
    history.scrollRestoration = 'manual';
    try {
      var theme = localStorage.getItem('minamo.theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
        var color = theme === 'dark' ? '#1C1B1A' : '#F7F5F0';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) { meta.content = color; });
      }
      if (localStorage.getItem('minamo.textSize') === 'large') document.documentElement.dataset.textSize = 'large';
    } catch (e) {}
  </script>
<link rel="stylesheet" href="styles-2IUE6WO7.css"></head>
<body>
  <app-stream-page></app-stream-page>
<script src="main-23PJH3HI.js" type="module"></script></body>
</html>
