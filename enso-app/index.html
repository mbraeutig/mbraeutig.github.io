<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Transform your training into a conscious ritual. Open a circle with intention, close it with reflection.">
    <meta name="theme-color" content="#4F5D75">
    <title>円相 Enso - The Training Circle</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!-- Google Fonts: Distinctive Japanese-inspired typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
           CSS VARIABLES - Design System
        ======================================== */
        :root {
            /* Colors - Zen Palette */
            --color-bg: #F5F2EB;
            --color-surface: #FFFFFF;
            --color-text: #1A1A1A;
            --color-text-secondary: #6B6B6B;
            --color-accent: #4F5D75;
            --color-accent-hover: #3D4A5C;
            --color-enso: #2F2C29; /* Sumi-Tinte */
            --color-border: #E0DDD5;
            
            /* Typography */
            --font-primary: 'Cormorant Garamond', serif;
            --font-japanese: 'Noto Serif JP', serif;
            
            /* Spacing */
            --space-xs: 0.5rem;
            --space-s: 1rem;
            --space-m: 1.5rem;
            --space-l: 2rem;
            --space-xl: 3rem;
            
            /* Border Radius */
            --radius-s: 8px;
            --radius-m: 12px;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* ========================================
           RESET & BASE STYLES
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        [hidden] {
            display: none !important;
        }

        html {
            font-size: 16px;
        }
        
        body {
            font-family: var(--font-primary);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        
        /* ========================================
           LAYOUT - App Container
        ======================================== */
        .app-container {
            max-width: 400px;
            min-height: 100vh;
            min-height: 100dvh; /* mobile Browserleisten berücksichtigen */
            margin: 0 auto;
            background: var(--color-bg);
            padding: var(--space-l);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .screen {
            display: none;
            width: 100%;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity var(--transition-smooth), transform var(--transition-smooth);
        }
        
        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 1;
            transform: translateY(0);
        }

        /* Einblenden trotz Wechsel von display:none. Muss NACH .screen.active
           stehen (gleiche Spezifität). Browser ohne Support: harter Wechsel. */
        @starting-style {
            .screen.active {
                opacity: 0;
                transform: translateY(10px);
            }
        }
        
        /* ========================================
           ENSO CIRCLE - The Core Visual
        ======================================== */
        .enso-container {
            width: 160px;
            height: 160px;
            margin: var(--space-xl) 0;
            position: relative;
        }
        
        .enso-circle {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        /* Breathing animation for open circle */
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        
        .enso-circle.breathing {
            animation: breathe 3s ease-in-out infinite;
        }
        
        /* Pulse on interaction */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        .enso-circle.pulse {
            animation: pulse 0.6s ease-out;
        }
        
        /* SVG Circle styles */
        .enso-svg {
            width: 100%;
            height: 100%;
            color: var(--color-enso); /* Symbole füllen mit currentColor */
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
        }
        
        /* ========================================
           TYPOGRAPHY
        ======================================== */
        .title {
            font-family: var(--font-japanese);
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: var(--color-text);
            margin-bottom: var(--space-s);
            text-align: center;
        }
        
        .subtitle {
            font-family: var(--font-primary);
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--color-text-secondary);
            text-align: center;
            margin-bottom: var(--space-xl);
            letter-spacing: 0.02em;
        }
        
        .prompt {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--color-text);
            text-align: center;
            margin-bottom: var(--space-l);
            letter-spacing: 0.01em;
        }
        
        /* ========================================
           BUTTONS - Activity & Intention
        ======================================== */
        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--space-s);
            margin-bottom: var(--space-l);
        }
        
        .activity-button,
        .intention-button {
            width: 100%;
            padding: var(--space-m);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-m);
            font-family: var(--font-primary);
            font-size: 1.1rem;
            color: var(--color-text);
            cursor: pointer;
            transition: border-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--space-s);
            position: relative;
            overflow: hidden;
        }
        
        .activity-button::before,
        .intention-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(79, 93, 117, 0.05));
            transition: width var(--transition-smooth);
        }
        
        .activity-button:hover::before,
        .intention-button:hover::before {
            width: 100%;
        }
        
        .activity-button:hover,
        .intention-button:hover {
            border-color: var(--color-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 93, 117, 0.1);
        }
        
        .activity-button:active,
        .intention-button:active {
            transform: translateY(0);
        }

        .activity-button:focus-visible,
        .intention-button:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        /* Gewählte Intention: Zustand über aria-pressed statt Inline-Style */
        .intention-button[aria-pressed="true"] {
            border-color: var(--color-accent);
            box-shadow: inset 0 0 0 1px var(--color-accent);
            background: rgba(79, 93, 117, 0.06);
        }

        .intention-button[aria-pressed="true"]::after {
            content: '✓';
            content: '✓' / ''; /* leerer Alternativtext: "gedrückt" sagt der Screenreader schon */
            margin-left: auto;
            color: var(--color-accent);
        }

        .activity-icon {
            font-size: 1.5rem;
        }
        
        /* ========================================
           PRIMARY ACTION BUTTON
        ======================================== */
        .primary-button {
            width: 100%;
            padding: var(--space-m);
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: var(--radius-full);
            font-family: var(--font-primary);
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(79, 93, 117, 0.2);
        }
        
        .primary-button:hover {
            background: var(--color-accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 93, 117, 0.3);
        }
        
        .primary-button:active {
            transform: translateY(0);
        }

        .primary-button:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 3px;
        }

        .primary-button:disabled {
            opacity: 0.6;
            cursor: default;
            transform: none;
        }

        /* ========================================
           TEXT BUTTON - Secondary actions (Zurück, Verwerfen)
        ======================================== */
        .text-button {
            margin-top: var(--space-s);
            padding: var(--space-xs) var(--space-s);
            background: none;
            border: none;
            font-family: var(--font-primary);
            font-size: 1rem;
            color: var(--color-text-secondary);
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: color var(--transition-fast);
        }

        .text-button:hover {
            color: var(--color-accent);
        }

        .text-button:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
            border-radius: var(--radius-s);
        }

        /* ========================================
           INTENTION RECAP - shown while reflecting
        ======================================== */
        .intention-recap {
            font-size: 1.05rem;
            font-style: italic;
            color: var(--color-text-secondary);
            text-align: center;
            margin-bottom: var(--space-s);
        }

        /* ========================================
           REFLECTION TEXT AREA
        ======================================== */
        .reflection-container {
            width: 100%;
            margin-bottom: var(--space-l);
        }
        
        .reflection-textarea {
            width: 100%;
            min-height: 150px;
            padding: var(--space-m);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-m);
            font-family: var(--font-primary);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--color-text);
            resize: vertical;
            transition: border-color var(--transition-fast);
        }
        
        .reflection-textarea:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(79, 93, 117, 0.3);
        }

        /* Volle Deckkraft: #6B6B6B auf Weiß erreicht 5,3:1 (WCAG AA) */
        .reflection-textarea::placeholder {
            color: var(--color-text-secondary);
            opacity: 1;
        }

        /* Fokus-Ziele beim Screenwechsel (tabindex="-1"): kein Rahmen nötig */
        .prompt:focus,
        .history-title:focus {
            outline: none;
        }
        
        /* ========================================
           NOTIFICATION - Success Feedback
        ======================================== */
        .notification {
            position: fixed;
            top: var(--space-l);
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-m);
            padding: var(--space-m);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            opacity: 0;
            transition: all var(--transition-smooth);
            z-index: 1000;
            max-width: 90%;
        }
        
        .notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .notification-text {
            font-size: 0.95rem;
            color: var(--color-text);
            text-align: center;
        }
        
        /* ========================================
           HISTORY - Monatskalender & Kreis-Liste
        ======================================== */
        #screen-history {
            padding-top: var(--space-l);
        }

        .history-title {
            font-family: var(--font-japanese);
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            margin-bottom: var(--space-m);
            text-align: center;
        }

        .month-nav {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-s);
        }

        .month-label {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .month-nav-button {
            width: 44px;
            height: 44px;
            background: none;
            border: none;
            border-radius: var(--radius-full);
            font-family: var(--font-primary);
            font-size: 1.5rem;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: color var(--transition-fast), background var(--transition-fast);
        }

        .month-nav-button:hover:not(:disabled) {
            color: var(--color-accent);
            background: rgba(79, 93, 117, 0.06);
        }

        .month-nav-button:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .calendar {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: var(--space-l);
        }

        .calendar-weekday {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            text-align: center;
            padding-bottom: var(--space-xs);
            letter-spacing: 0.05em;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-primary);
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            background: none;
            border: none;
            border-radius: var(--radius-full);
            position: relative;
        }

        .calendar-day.today {
            color: var(--color-text);
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* Tag mit geschlossenem Kreis: kleiner Enso-Ring */
        .calendar-day.has-circle {
            color: var(--color-text);
            cursor: pointer;
            box-shadow: inset 0 0 0 1.5px var(--color-accent);
            transition: background var(--transition-fast), color var(--transition-fast);
        }

        .calendar-day.has-circle:hover {
            background: rgba(79, 93, 117, 0.08);
        }

        .calendar-day.has-circle[aria-pressed="true"] {
            background: var(--color-accent);
            color: white;
        }

        /* Anzahl als reine Deko: steht schon im aria-label. Als DOM-Text würde
           sie den sichtbaren Namen verfälschen ("20" + "2" = "202", WCAG 2.5.3). */
        .calendar-day[data-count]::after {
            content: attr(data-count);
            content: attr(data-count) / '';
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: var(--radius-full);
            background: var(--color-bg);
            border: 1px solid var(--color-accent);
            color: var(--color-accent);
            font-size: 0.65rem;
            line-height: 14px;
            text-align: center;
        }

        .history-list-heading {
            width: 100%;
            font-size: 1rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-s);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .history-list {
            width: 100%;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-s);
            margin-bottom: var(--space-l);
        }

        .history-entry {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-m);
            padding: var(--space-s) var(--space-m);
        }

        .history-entry-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: var(--space-s);
            font-size: 0.9rem;
            color: var(--color-text-secondary);
        }

        .history-entry-activity {
            color: var(--color-text);
            font-weight: 500;
        }

        .history-entry-intention {
            font-style: italic;
            color: var(--color-text-secondary);
            margin: 2px 0 var(--space-xs);
        }

        .history-entry-reflection {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .history-empty {
            width: 100%;
            text-align: center;
            font-style: italic;
            color: var(--color-text-secondary);
            margin: var(--space-m) 0 var(--space-l);
        }

        .export-group {
            width: 100%;
            display: flex;
            gap: var(--space-s);
        }

        .export-hint {
            width: 100%;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            text-align: center;
            margin-top: var(--space-xs);
        }

        .history-list-heading .text-button {
            margin-top: 0;
            padding: 0 var(--space-xs);
            font-size: 0.95rem;
        }

        .secondary-button {
            flex: 1;
            padding: var(--space-s);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            font-family: var(--font-primary);
            font-size: 1rem;
            color: var(--color-text);
            cursor: pointer;
            transition: border-color var(--transition-fast), color var(--transition-fast);
        }

        .secondary-button:hover:not(:disabled) {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        .secondary-button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .month-nav-button:focus-visible,
        .calendar-day:focus-visible,
        .secondary-button:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        /* ========================================
           RESPONSIVE - Mobile Adjustments
        ======================================== */
        @media (max-width: 400px) {
            .app-container {
                padding: var(--space-m);
            }
            
            .enso-container {
                width: 140px;
                height: 140px;
            }
            
            .title {
                font-size: 1.75rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
        }
        
        /* ========================================
           ACCESSIBILITY
        ======================================== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <script>
        /* ========================================
           APP STATE MANAGEMENT
        ======================================== */
        const STORAGE_KEY = 'enso-circles';

        // Symbol und Text getrennt: das Emoji ist Deko und wird Screenreadern verborgen
        const ACTIVITIES = {
            ride: { icon: '🚴', label: 'Ride' },
            climb: { icon: '🧗', label: 'Climb' },
            practice: { icon: '🧘', label: 'Practice' }
        };

        /** Klartext mit Emoji, z. B. für den Markdown-Export */
        function activityText(key) {
            const a = ACTIVITIES[key];
            return a ? `${a.icon} ${a.label}` : key;
        }

        /** DOM-Fragment: Emoji (aria-hidden) + englisches Label */
        function activityNodes(key) {
            const a = ACTIVITIES[key];
            if (!a) return [document.createTextNode(key)];
            const icon = document.createElement('span');
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = `${a.icon} `;
            const label = document.createElement('span');
            label.lang = 'en';
            label.textContent = a.label;
            return [icon, label];
        }

        const INTENTION_LABELS = {
            strength: 'Kraft aufbauen',
            limits: 'Grenzen testen',
            flow: 'Im Flow sein',
            enjoy: 'Einfach genießen'
        };

        const AppState = {
            currentScreen: 'screen-select',
            selectedActivity: null,
            selectedIntention: null,
            openCircleId: null, // ID des (einzigen) offenen Kreises
            busy: false,        // true während einer Transition: blockt Doppeltipps
            readOnly: false,    // true, wenn gespeicherte Daten aus einer neueren Version stammen
            circles: []         // persistiert in localStorage
        };

        function createId() {
            if (window.crypto && typeof crypto.randomUUID === 'function') {
                return crypto.randomUUID();
            }
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        }

        function findOpenCircle() {
            if (!AppState.openCircleId) return null;
            return AppState.circles.find(c => c.id === AppState.openCircleId) || null;
        }

        /* ========================================
           DOM ELEMENTS
        ======================================== */
        const screens = {
            select: document.getElementById('screen-select'),
            intention: document.getElementById('screen-intention'),
            reflection: document.getElementById('screen-reflection'),
            history: document.getElementById('screen-history')
        };
        
        const elements = {
            activityButtons: document.querySelectorAll('.activity-button'),
            intentionButtons: document.querySelectorAll('.intention-button'),
            btnOpenCircle: document.getElementById('btn-open-circle'),
            btnCloseCircle: document.getElementById('btn-close-circle'),
            btnBack: document.getElementById('btn-back'),
            btnDiscardCircle: document.getElementById('btn-discard-circle'),
            intentionRecap: document.getElementById('intention-recap'),
            reflectionText: document.getElementById('reflection-text'),
            notification: document.getElementById('notification'),
            notificationText: document.getElementById('notification-text'),
            ensoOpen: document.getElementById('enso-open'),
            ensoClosed: document.getElementById('enso-closed'),
            btnShowHistory: document.getElementById('btn-show-history'),
            btnHistoryBack: document.getElementById('btn-history-back'),
            btnPrevMonth: document.getElementById('btn-prev-month'),
            btnNextMonth: document.getElementById('btn-next-month'),
            monthLabel: document.getElementById('month-label'),
            calendar: document.getElementById('calendar'),
            historyListTitle: document.getElementById('history-list-title'),

            historyList: document.getElementById('history-list'),
            historyEmpty: document.getElementById('history-empty'),
            btnExportMd: document.getElementById('btn-export-md'),
            btnExportJson: document.getElementById('btn-export-json'),
            btnImport: document.getElementById('btn-import'),
            importFile: document.getElementById('import-file')
        };
        
        /* ========================================
           SCREEN TRANSITION
        ======================================== */
        // Wohin der Fokus beim Screenwechsel springt (Elemente mit tabindex="-1")
        const SCREEN_FOCUS_TARGETS = {
            select: 'prompt-select',
            intention: 'prompt-intention',
            reflection: 'prompt-reflection',
            history: 'history-title'
        };

        // Erst nach der ersten Eingabe Fokus verschieben: beim Start der App soll
        // nichts fokussiert werden. Nicht an activeElement festmachen, denn
        // gesperrte Buttons (Busy-Lock) verlieren den Fokus an <body>.
        let userHasInteracted = false;
        ['pointerdown', 'keydown'].forEach(type => {
            document.addEventListener(type, () => { userHasInteracted = true; }, { capture: true, once: true });
        });

        function showScreen(screenId) {
            // Hide all screens
            Object.values(screens).forEach(screen => {
                screen.classList.remove('active');
            });

            // Show target screen
            setTimeout(() => {
                screens[screenId].classList.add('active');
                AppState.currentScreen = `screen-${screenId}`;
                window.scrollTo(0, 0);

                // Fokus mitnehmen: sonst bleibt er auf einem versteckten Button
                // hängen (Tastatur, Screenreader)
                if (userHasInteracted) {
                    document.getElementById(SCREEN_FOCUS_TARGETS[screenId])?.focus({ preventScroll: true });
                }
            }, 100);
        }

        /* ========================================
           NOTIFICATION SYSTEM
        ======================================== */
        let notificationTimer = null;

        function showNotification(message, duration = 2000) {
            elements.notificationText.textContent = message;
            elements.notification.classList.add('show');

            // Eine neue Meldung darf nicht vom Timer der vorherigen ausgeblendet werden
            clearTimeout(notificationTimer);
            notificationTimer = setTimeout(() => {
                elements.notification.classList.remove('show');
            }, duration);
        }
        
        /* ========================================
           ENSO PULSE ANIMATION
        ======================================== */
        function pulseEnso(element) {
            element.classList.add('pulse');
            setTimeout(() => {
                element.classList.remove('pulse');
            }, 600);
        }
        
        /* ========================================
           BUSY LOCK - verhindert Doppeltipps während Transitions
        ======================================== */
        function setBusy(isBusy) {
            AppState.busy = isBusy;
            elements.btnOpenCircle.disabled = isBusy;
            elements.btnCloseCircle.disabled = isBusy;
        }

        function afterDelay(ms, fn) {
            setBusy(true);
            setTimeout(() => {
                fn();
                setBusy(false);
            }, ms);
        }

        /* ========================================
           HELPERS - Selection & Screens
        ======================================== */
        let selectedIntentionButton = null;

        function resetSelection() {
            AppState.selectedActivity = null;
            AppState.selectedIntention = null;
            selectIntentionButton(null);
            elements.reflectionText.value = '';
            resetDiscardButton();
        }

        /** Markiert genau einen Intentions-Button als gewählt (oder keinen) */
        function selectIntentionButton(selected) {
            elements.intentionButtons.forEach(button => {
                button.setAttribute('aria-pressed', String(button === selected));

            selectedIntentionButton = selected;
        }

        function showReflectionScreen() {
            const circle = findOpenCircle();

                const intention = INTENTION_LABELS[circle.intention] || circle.intention;
                elements.intentionRecap.replaceChildren(
                    document.createTextNode(`Deine Intention: ${intention} · `),
                    ...activityNodes(circle.activity)
                );

                elements.intentionRecap.replaceChildren();
            }
            showScreen('reflection');
        }

        /* ========================================
           EVENT HANDLERS - Activity Selection
        ======================================== */
        elements.activityButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (AppState.busy) return;
                AppState.selectedActivity = button.dataset.activity;

                // Visual feedback
                pulseEnso(elements.ensoOpen);

                // Transition to intention screen
                afterDelay(400, () => showScreen('intention'));
            });

        /* ========================================
           EVENT HANDLERS - Intention Selection
        ======================================== */
        elements.intentionButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (AppState.busy) return;
                AppState.selectedIntention = button.dataset.intention;
                selectIntentionButton(button);
            });
        });

        elements.btnBack.addEventListener('click', () => {
            if (AppState.busy) return;
            resetSelection();
            showScreen('select');
        });

        /* ========================================
           EVENT HANDLERS - Open Circle
        ======================================== */
        elements.btnOpenCircle.addEventListener('click', () => {
            if (AppState.busy) return;

            if (AppState.readOnly) {
                showNotification(READ_ONLY_MESSAGE, 4000);
                return;
            }

            if (!AppState.selectedIntention) {
                showNotification('Bitte wähle eine Intention');
                return;
            }

            // Invariante: es gibt höchstens einen offenen Kreis
            if (findOpenCircle()) {
                showReflectionScreen();
                return;
            }

            const circle = {
                id: createId(),
                activity: AppState.selectedActivity,
                intention: AppState.selectedIntention,
                date: new Date(),
                closed: false
            };

            AppState.circles.push(circle);
            AppState.openCircleId = circle.id;
            saveCircles();

            showNotification('Kreis geöffnet. Viel Erfolg! 🎯', 2500);

            // Simulate: App minimizes, user goes to train
            // In real app, this would return to home screen
            afterDelay(2500, () => {
                elements.reflectionText.value = '';
                showReflectionScreen();
            });
        });

        /* ========================================
           EVENT HANDLERS - Close Circle
        ======================================== */
        elements.btnCloseCircle.addEventListener('click', () => {
            if (AppState.busy) return;

            const reflection = elements.reflectionText.value.trim();
            if (!reflection) {
                showNotification('Bitte teile deine Gedanken');
                return;
            }

            const circle = findOpenCircle();
            if (!circle) {
                // Inkonsistenter Zustand: nicht so tun, als wäre gespeichert worden
                showNotification('Kein offener Kreis gefunden');
                resetSelection();
                showScreen('select');
                return;
            }

            circle.reflection = reflection;
            circle.closed = true;
            circle.closedAt = new Date();
            AppState.openCircleId = null;
            saveCircles();

            // Visual feedback
            pulseEnso(elements.ensoClosed);
            showNotification('Kreis geschlossen ⭕', 2000);

            // Return to start
            afterDelay(2000, () => {
                resetSelection();
                showScreen('select');
            });
        });

        /* ========================================
           EVENT HANDLERS - Discard Circle (zweimal tippen)
        ======================================== */
        let discardConfirmTimer = null;

        function resetDiscardButton() {
            clearTimeout(discardConfirmTimer);
            discardConfirmTimer = null;
            elements.btnDiscardCircle.textContent = 'Kreis verwerfen';
        }

        elements.btnDiscardCircle.addEventListener('click', () => {
            if (AppState.busy) return;

            // Erster Tipp: nur nachfragen
            if (!discardConfirmTimer) {
                elements.btnDiscardCircle.textContent = 'Wirklich verwerfen? Nochmal tippen';
                discardConfirmTimer = setTimeout(resetDiscardButton, 3000);
                return;
            }

            // Zweiter Tipp: offenen Kreis entfernen
            AppState.circles = AppState.circles.filter(c => c.id !== AppState.openCircleId);
            AppState.openCircleId = null;
            saveCircles();

            showNotification('Kreis verworfen');
            resetSelection();
            showScreen('select');
        });

        /* ========================================
           SCHEMA & MIGRATIONEN
           Speicher und JSON-Export nutzen dieselbe Hülle:
             { schemaVersion: <Zahl>, circles: Circle[] }
           Version 0 = Altformat: nacktes Array ohne Hülle.

           Neue Version einführen:
             1. SCHEMA_VERSION erhöhen
             2. MIGRATIONS[alteVersion] ergänzen (hebt um genau eine Version an)
           Gespeicherte Daten und importierte Backups laufen beide durch
           migrateData(), alte Backups bleiben also importierbar.
        ======================================== */
        const SCHEMA_VERSION = 1;

        const MIGRATIONS = {
            // 0 -> 1: nacktes Array in die versionierte Hülle packen
            0: (data) => ({ ...data, schemaVersion: 1 })
        };

        class SchemaError extends Error {}
        class SchemaTooNewError extends SchemaError {}

        /** Normalisiert Rohdaten auf die Hülle und migriert bis SCHEMA_VERSION */
        function migrateData(raw) {
            let data = Array.isArray(raw) ? { schemaVersion: 0, circles: raw } : raw;

            if (!data || typeof data !== 'object' || !Array.isArray(data.circles)) {
                throw new SchemaError('Unbekanntes Datenformat');
            }
            if (data.schemaVersion === undefined) data = { ...data, schemaVersion: 1 };
            if (!Number.isInteger(data.schemaVersion) || data.schemaVersion < 0) {
                throw new SchemaError('Ungültige Schema-Version');
            }
            if (data.schemaVersion > SCHEMA_VERSION) {
                throw new SchemaTooNewError(`Schema-Version ${data.schemaVersion} ist neuer als ${SCHEMA_VERSION}`);
            }

            const fromVersion = data.schemaVersion;
            while (data.schemaVersion < SCHEMA_VERSION) {
                data = MIGRATIONS[data.schemaVersion](data);
            }
            return { data, migrated: data.schemaVersion !== fromVersion };
        }

        /* ========================================
           LOAD SAVED CIRCLES (from localStorage)
        ======================================== */
        const READ_ONLY_MESSAGE = 'Deine Daten stammen aus einer neueren App-Version. Bitte die App neu laden.';

        /** Legt eine Kopie unlesbarer Daten an, bevor sie überschrieben werden könnten */
        function backupUnreadableData(raw) {
            const key = `${STORAGE_KEY}-backup-${Date.now()}`;
            try {
                localStorage.setItem(key, raw);
                return key;
            } catch (e) {
                console.error('Backup of unreadable data failed:', e);
                return null;
            }
        }

        function loadCircles() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;

            let stored;
            try {
                stored = migrateData(JSON.parse(saved));
            } catch (e) {
                if (e instanceof SchemaTooNewError) {
                    // Nichts laden, nichts schreiben: sonst gingen die neueren Daten verloren
                    AppState.readOnly = true;
                    console.warn(e.message);
                    showNotification(READ_ONLY_MESSAGE, 6000);
                    return;
                }
                const backupKey = backupUnreadableData(saved);
                console.error('Stored data unreadable, backup:', backupKey, e);
                showNotification('Gespeicherte Daten waren unlesbar. Eine Kopie wurde gesichert.', 5000);
                return;
            }

            // Restore Date objects
            const parsed = stored.data.circles.map(c => ({
                ...c,
                date: new Date(c.date),
                ...(c.closedAt ? { closedAt: new Date(c.closedAt) } : {})
            }));

            const { circles, changed } = repairCircles(parsed);
            AppState.circles = circles;
            if (changed || stored.migrated) saveCircles();

            // Restore open circle (at most one after repair)
            const openCircle = AppState.circles.find(c => !c.closed);
            if (openCircle) {
                AppState.openCircleId = openCircle.id;
                AppState.selectedActivity = openCircle.activity;
                AppState.selectedIntention = openCircle.intention;
                showReflectionScreen();
            }
        }

        /* ========================================
           REPAIR - Altdaten aus dem Doppeltipp-Bug
           1. Doppelte/fehlende IDs bekommen eine neue ID.
           2. Gibt es mehrere offene Kreise, bleibt nur der jüngste offen.
              Ältere offene Kreise sind Duplikate ohne Reflexion und
              werden entfernt.
        ======================================== */
        function repairCircles(circles) {
            let changed = false;

            const seenIds = new Set();
            circles.forEach(c => {
                if (c.id == null || seenIds.has(c.id)) {
                    c.id = createId();
                    changed = true;
                }
                seenIds.add(c.id);
            });

            const openCircles = circles.filter(c => !c.closed);
            if (openCircles.length > 1) {
                const newest = openCircles.reduce((a, b) => (b.date > a.date ? b : a));
                circles = circles.filter(c => c.closed || c === newest);
                changed = true;
            }

            return { circles, changed };
        }

        /* ========================================
           SAVE CIRCLES (to localStorage)
        ======================================== */
        function saveCircles() {
            if (AppState.readOnly) {
                showNotification(READ_ONLY_MESSAGE, 4000);
                return false;
            }
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    schemaVersion: SCHEMA_VERSION,
                    circles: AppState.circles
                }));
                return true;
            } catch (e) {
                console.error('Error saving circles:', e);
                showNotification('Speichern fehlgeschlagen', 3000);
                return false;
            }
        }

        /* ========================================
           HISTORY - Datums-Helfer
           Tage werden in lokaler Zeit gruppiert (nicht UTC), sonst landet
           ein Kreis um 00:30 Uhr auf dem Vortag.
        ======================================== */
        const MONTH_FORMAT = new Intl.DateTimeFormat('de-DE', { month: 'long', year: 'numeric' });
        const DAY_FORMAT = new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
        const DAY_LONG_FORMAT = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
        const TIME_FORMAT = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' });
        const WEEKDAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

        function dayKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseDayKey(key) {
            const [y, m, d] = key.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function isSameMonth(a, b) {
            return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
        }

        function startOfMonth(date) {
            return new Date(date.getFullYear(), date.getMonth(), 1);
        }

        function isValidDate(date) {
            return date instanceof Date && !isNaN(date);
        }

        /** Geschlossene Kreise mit gültigem Datum, chronologisch aufsteigend */
        function getClosedCircles() {
            return AppState.circles
                .filter(c => c.closed && isValidDate(c.date))
                .sort((a, b) => a.date - b.date);
        }

        /* ========================================
           HISTORY - Rendering
        ======================================== */
        const HistoryState = {
            month: startOfMonth(new Date()),
            selectedDay: null // 'YYYY-MM-DD' oder null = ganzer Monat
        };

        function renderEntry(circle) {
            const li = document.createElement('li');
            li.className = 'history-entry';

            const meta = document.createElement('div');
            meta.className = 'history-entry-meta';

            const activity = document.createElement('span');
            activity.className = 'history-entry-activity';
            activity.append(...activityNodes(circle.activity));

            const when = document.createElement('time');
            when.dateTime = circle.date.toISOString();
            when.textContent = `${DAY_FORMAT.format(circle.date)} · ${TIME_FORMAT.format(circle.date)}`;

            meta.append(activity, when);

            const intention = document.createElement('p');
            intention.className = 'history-entry-intention';
            intention.textContent = INTENTION_LABELS[circle.intention] || circle.intention;

            const reflection = document.createElement('p');
            reflection.className = 'history-entry-reflection';
            reflection.textContent = circle.reflection || '';

            li.append(meta, intention, reflection);
            return li;
        }

        function renderCalendar(month, byDay, selectedDay) {
            const todayKey = dayKey(new Date());
            const cells = [];

            WEEKDAYS.forEach(name => {
                const el = document.createElement('span');
                el.className = 'calendar-weekday';
                el.textContent = name;
                el.setAttribute('aria-hidden', 'true');
                cells.push(el);
            });

            // Woche beginnt am Montag
            const offset = (month.getDay() + 6) % 7;
            for (let i = 0; i < offset; i++) {
                cells.push(document.createElement('span'));
            }

            const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(month.getFullYear(), month.getMonth(), day);
                const key = dayKey(date);
                const entries = byDay.get(key);

                const el = document.createElement(entries ? 'button' : 'span');
                el.className = 'calendar-day';
                el.textContent = day;
                if (key === todayKey) el.classList.add('today');

                if (entries) {
                    el.type = 'button';
                    el.classList.add('has-circle');
                    el.dataset.day = key;
                    el.setAttribute('aria-pressed', String(key === selectedDay));
                    el.setAttribute('aria-label',
                        `${DAY_LONG_FORMAT.format(date)}: ${entries.length} ${entries.length === 1 ? 'Kreis' : 'Kreise'}`);

                    if (entries.length > 1) {
                        el.dataset.count = entries.length;
                    }
                }
                cells.push(el);
            }

            elements.calendar.replaceChildren(...cells);
        }

        function renderHistory() {
            const { month, selectedDay } = HistoryState;
            const allClosed = getClosedCircles();
            const monthCircles = allClosed.filter(c => isSameMonth(c.date, month));

            const byDay = new Map();
            monthCircles.forEach(c => {
                const key = dayKey(c.date);
                if (!byDay.has(key)) byDay.set(key, []);
                byDay.get(key).push(c);
            });

            elements.monthLabel.textContent = MONTH_FORMAT.format(month);
            elements.btnNextMonth.disabled = month >= startOfMonth(new Date());

            renderCalendar(month, byDay, selectedDay);

            // Liste: neueste zuerst
            const visible = selectedDay ? (byDay.get(selectedDay) || []) : monthCircles;
            const listed = [...visible].reverse();

            elements.historyListTitle.textContent = selectedDay
                ? DAY_LONG_FORMAT.format(parseDayKey(selectedDay))
                : 'Alle Kreise im Monat';
            elements.btnClearDay.hidden = !selectedDay;
            elements.historyList.replaceChildren(...listed.map(renderEntry));

            const isEmpty = listed.length === 0;
            elements.historyListTitle.parentElement.hidden = isEmpty;
            elements.historyEmpty.hidden = !isEmpty;
            elements.historyEmpty.textContent = allClosed.length === 0
                ? 'Noch keine geschlossenen Kreise. Dein erster wartet.'
                : 'In diesem Monat keine geschlossenen Kreise.';

            elements.btnExportMd.disabled = allClosed.length === 0;
            elements.btnExportJson.disabled = AppState.circles.length === 0;
        }

        function changeMonth(delta) {
            const m = HistoryState.month;
            HistoryState.month = new Date(m.getFullYear(), m.getMonth() + delta, 1);
            HistoryState.selectedDay = null;
            renderHistory();
        }

        /* ========================================
           EVENT HANDLERS - History
        ======================================== */
        elements.btnShowHistory.addEventListener('click', () => {
            if (AppState.busy) return;
            HistoryState.month = startOfMonth(new Date());
            HistoryState.selectedDay = null;
            renderHistory();
            showScreen('history');
        });

        elements.btnHistoryBack.addEventListener('click', () => showScreen('select'));
        elements.btnPrevMonth.addEventListener('click', () => changeMonth(-1));
        elements.btnNextMonth.addEventListener('click', () => changeMonth(1));

        elements.calendar.addEventListener('click', (event) => {
            const dayButton = event.target.closest('.calendar-day.has-circle');
            if (!dayButton) return;

            const key = dayButton.dataset.day;
            HistoryState.selectedDay = HistoryState.selectedDay === key ? null : key;
            renderHistory();

            // Fokus bleibt auf dem Tag, obwohl der Kalender neu gerendert wurde
            elements.calendar.querySelector(`[data-day="${key}"]`)?.focus();
        });

        elements.btnClearDay.addEventListener('click', () => {
            HistoryState.selectedDay = null;
            renderHistory();
        });

        /* ========================================
           EXPORT - Markdown (lesbar) & JSON (Backup)
        ======================================== */
        function buildMarkdown(circles, exportedAt = new Date()) {
            const lines = [
                '# 円相 Enso – Meine Kreise',
                '',
                `Exportiert am ${DAY_FORMAT.format(exportedAt)} um ${TIME_FORMAT.format(exportedAt)} Uhr`,
                ''
            ];

            let currentMonth = null;
            circles.forEach(c => {
                const month = MONTH_FORMAT.format(c.date);
                if (month !== currentMonth) {
                    lines.push(`## ${month}`, '');
                    currentMonth = month;
                }

                lines.push(`### ${DAY_FORMAT.format(c.date)} · ${activityText(c.activity)}`, '');
                lines.push(`**Intention:** ${INTENTION_LABELS[c.intention] || c.intention}  `);

                const times = [`geöffnet ${TIME_FORMAT.format(c.date)}`];
                if (isValidDate(c.closedAt)) times.push(`geschlossen ${TIME_FORMAT.format(c.closedAt)}`);
                lines.push(`**Zeit:** ${times.join(' · ')}`, '');

                (c.reflection || '').split(/\r?\n/).forEach(line => {
                    lines.push(`> ${line}`.trimEnd());
                });
                lines.push('');
            });

            return lines.join('\n');
        }

        function buildJsonExport(exportedAt = new Date()) {
            return JSON.stringify({
                app: 'enso',
                schemaVersion: SCHEMA_VERSION,
                exportedAt: exportedAt.toISOString(),
                circles: AppState.circles
            }, null, 2);
        }

        function downloadFile(filename, content, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        elements.btnExportMd.addEventListener('click', () => {
            downloadFile(`enso-kreise-${dayKey(new Date())}.md`,
                buildMarkdown(getClosedCircles()), 'text/markdown;charset=utf-8');
            showNotification('Markdown-Export erstellt');
        });

        elements.btnExportJson.addEventListener('click', () => {
            downloadFile(`enso-backup-${dayKey(new Date())}.json`,
                buildJsonExport(), 'application/json;charset=utf-8');
            showNotification('JSON-Backup erstellt');
        });

        /* ========================================
           IMPORT - JSON-Backup zurückspielen
           Zusammenführen statt Überschreiben: vorhandene Kreise bleiben
           unangetastet, nur unbekannte IDs werden ergänzt. Offene Kreise
           aus dem Backup werden übersprungen (Invariante: max. ein offener
           Kreis, und der gehört zum aktuellen Gerät).
        ======================================== */
        const MAX_IMPORT_BYTES = 5 * 1024 * 1024;

        class ImportError extends Error {}

        /** Liefert einen bereinigten Kreis oder null, wenn der Eintrag ungültig ist */
        function sanitizeImportedCircle(raw) {
            if (!raw || typeof raw !== 'object') return null;

            const idOk = (typeof raw.id === 'string' && raw.id !== '') || Number.isFinite(raw.id);
            const date = new Date(raw.date);
            if (!idOk
                || typeof raw.activity !== 'string' || raw.activity === ''
                || typeof raw.intention !== 'string' || raw.intention === ''
                || typeof raw.closed !== 'boolean'
                || (raw.reflection !== undefined && typeof raw.reflection !== 'string')
                || !isValidDate(date)) {
                return null;
            }

            // Nur bekannte Felder übernehmen
            const circle = {
                id: raw.id,
                activity: raw.activity,
                intention: raw.intention,
                date,
                closed: raw.closed
            };
            if (raw.reflection !== undefined) circle.reflection = raw.reflection;
            const closedAt = new Date(raw.closedAt);
            if (raw.closedAt && isValidDate(closedAt)) circle.closedAt = closedAt;
            return circle;
        }

        /** Akzeptiert das Export-Format ({ app, schemaVersion, circles }) oder ein nacktes Array
            und migriert ältere Backups auf die aktuelle Schema-Version */
        function extractImportedCircles(data) {
            if (!Array.isArray(data) && (!data || typeof data !== 'object' || data.app !== 'enso')) {
                throw new ImportError('Die Datei ist kein Enso-Backup');
            }
            try {
                return migrateData(data).data.circles;
            } catch (e) {
                if (e instanceof SchemaTooNewError) {
                    throw new ImportError(`Backup-Version ${data.schemaVersion} wird noch nicht unterstützt`);
                }
                if (e instanceof SchemaError) throw new ImportError('Die Datei ist kein Enso-Backup');
                throw e;
            }
        }

        /** Führt importierte Kreise mit den vorhandenen zusammen und liefert eine Statistik */
        function mergeImportedCircles(rawCircles) {
            const knownIds = new Set(AppState.circles.map(c => String(c.id)));
            const result = { added: 0, existing: 0, open: 0, invalid: 0 };

            rawCircles.forEach(raw => {
                const circle = sanitizeImportedCircle(raw);
                if (!circle) { result.invalid++; return; }
                if (!circle.closed) { result.open++; return; }

                const key = String(circle.id);
                if (knownIds.has(key)) { result.existing++; return; }

                knownIds.add(key);
                AppState.circles.push(circle);
                result.added++;
            });

            return result;
        }

        function formatImportResult({ added, existing, open, invalid }) {
            const parts = [`${added} ${added === 1 ? 'Kreis' : 'Kreise'} importiert`];
            if (existing) parts.push(`${existing} schon vorhanden`);
            const skipped = open + invalid;
            if (skipped) parts.push(`${skipped} übersprungen`);
            return parts.join(' · ');
        }

        async function importBackupFile(file) {
            if (AppState.readOnly) throw new ImportError(READ_ONLY_MESSAGE);
            if (file.size > MAX_IMPORT_BYTES) {
                throw new ImportError('Die Datei ist zu groß (max. 5 MB)');
            }

            let data;
            try {
                data = JSON.parse(await file.text());
            } catch {
                throw new ImportError('Die Datei ist kein gültiges JSON');
            }

            const result = mergeImportedCircles(extractImportedCircles(data));
            if (result.added > 0) saveCircles();
            return result;
        }

        elements.btnImport.addEventListener('click', () => {
            elements.importFile.value = ''; // gleiche Datei erneut wählbar
            elements.importFile.click();
        });

        elements.importFile.addEventListener('change', async () => {
            const file = elements.importFile.files[0];
            if (!file) return;

            try {
                const result = await importBackupFile(file);
                renderHistory();
                showNotification(formatImportResult(result), 3500);
            } catch (e) {
                if (!(e instanceof ImportError)) console.error('Import failed:', e);
                showNotification(e instanceof ImportError ? e.message : 'Import fehlgeschlagen', 3500);
            }
        });

        /* ========================================
           INITIALIZATION
        ======================================== */
        document.addEventListener('DOMContentLoaded', () => {
            loadCircles();
            console.log('円相 Enso initialized');
            console.log('Loaded circles:', AppState.circles.length);
        });

        // Kein Speichern bei beforeunload: jede Änderung wird sofort gespeichert.
        // Ein Speichern beim Verlassen würde neuere Daten aus anderen Tabs
        // mit dem veralteten Stand dieses Tabs überschreiben.

        /* ========================================
           SERVICE WORKER REGISTRATION
        ======================================== */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Enso: Service Worker registered');
                    })
                    .catch((error) => {
                        console.log('Enso: Service Worker registration failed:', error);
                    });
            });
        }

    </script>
</body>
</html>
