<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>間 Ma - Space Between</title>

  <!-- PWA Meta Tags -->
  <meta name="description" content="Minimalistische Achtsamkeits-App für Mikro-Pausen im Alltag">
  <meta name="theme-color" content="#D4C5B0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ma">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-TileColor" content="#D4C5B0">
  <meta name="msapplication-tap-highlight" content="no">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Font: selbst gehostet – keine Requests an Dritte (DSGVO), offline ab dem ersten Start -->
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    /* ========================================
       FONTS
       Inter (Variable Font, Latin-Subset inkl. Umlaute), Lizenz: fonts/LICENSE-Inter.txt
       ======================================== */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('fonts/inter-latin-wght-normal.woff2') format('woff2');
    }

    /* ========================================
       CSS VARIABLES - Design System
       Leicht anpassbar für Theming
       ======================================== */
    :root {
      --color-bg: #FAFAF9;
      --color-accent: #D4C5B0;        /* Dekorative Flächen (Atemkreis) */
      --color-accent-fill: #D4C5B0;   /* Flächen hinter Text (Hover, Notification) – Text ≥ 4.5:1 */
      --color-accent-strong: #968368; /* Rahmen & Icons – ≥ 3:1 auf --color-bg */
      --color-text: #2D2D2D;
      --color-subtle: #E8E4DF;        /* Hover-Flächen */
      --color-border: #8F8A84;        /* Rahmen von Eingabefeldern – ≥ 3:1 auf --color-bg */
      --color-light: #6E6A65;         /* Gedämpfter Text – ≥ 4.5:1 auf --color-bg */

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --font-primary: 'Inter', system-ui, sans-serif;
      
      --transition-smooth: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: all 0.3s ease;
      
      --spacing-xs: 0.5rem;
      --spacing-sm: 1rem;
      --spacing-md: 2rem;
      --spacing-lg: 3rem;
      --spacing-xl: 4rem;
    }

    /* ========================================
       BASE STYLES
       ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-primary);
      background: var(--color-bg);
      color: var(--color-text);
      /* min-height statt height + kein overflow:hidden: Bei geöffneter Tastatur bleibt alles erreichbar */
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ========================================
       CONTAINER - Main App Wrapper
       ======================================== */
    .app-container {
      width: 100%;
      max-width: 400px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: calc(var(--spacing-md) + var(--safe-top)) calc(var(--spacing-md) + var(--safe-right))
               calc(var(--spacing-md) + var(--safe-bottom)) calc(var(--spacing-md) + var(--safe-left));
      position: relative;
    }

    /* ========================================
       COMPONENTS - Reusable UI Elements
       ======================================== */

    /* Fokus-Indikator für Tastatur-Nutzung */
    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--color-accent-strong);
      outline-offset: 3px;
    }

    /* Programmatisch fokussierte Screens brauchen keinen Rahmen */
    .screen:focus {
      outline: none;
    }

    /* Eck-Buttons: Export (⤓) im Idle, Beenden (×) während einer Pause */
    .corner-button {
      position: absolute;
      top: calc(var(--spacing-md) + var(--safe-top));
      right: calc(var(--spacing-md) + var(--safe-right));
      min-width: 44px;
      min-height: 44px;
      background: transparent;
      border: none;
      color: var(--color-accent-strong);
      font-family: var(--font-primary);
      font-size: 1.5rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-fast);
      z-index: 100;
    }

    @media (hover: hover) {
      .corner-button:hover {
        color: var(--color-text);
        transform: translateY(-2px);
      }
    }

    /* Ma Character – SVG-Pfad aus Noto Sans JP Light (icons/ma-glyph.svg),
       damit kein japanischer Webfont geladen werden muss */
    .ma-character {
      height: 104px;           /* entspricht 間 bei 120px Schriftgröße */
      aspect-ratio: 812 / 865;
      fill: currentColor;
      opacity: 0.7;
      margin-bottom: var(--spacing-xl);
      animation: breathe 10s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { 
        opacity: 0.4; 
        transform: scale(1); 
      }
      50% { 
        opacity: 0.7; 
        transform: scale(1.05); 
      }
    }

    /* Primary Button */
    .btn-primary {
      background: transparent;
      border: 1px solid var(--color-accent-strong);
      color: var(--color-text);
      padding: 1rem 3rem;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    @media (hover: hover) {
      .btn-primary:hover {
        background: var(--color-accent-fill);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(212, 197, 176, 0.3);
      }
    }

    /* Secondary Button */
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: 0.75rem 2rem;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    @media (hover: hover) {
      .btn-secondary:hover {
        background: var(--color-subtle);
      }
    }

    /* ========================================
       SCREENS - Different App States
       ======================================== */
    .screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      animation: fadeIn 0.6s ease-in-out;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========================================
       BREATHE MODE
       ======================================== */
    .breathe-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--color-accent);
      margin-bottom: var(--spacing-lg);
      /* Grundzustand = ausgeatmet. Die Dauer kommt aus JS (Config.BREATH_PHASE_MS),
         damit Kreis und Text exakt im selben Rhythmus laufen. */
      opacity: 0.3;
      transform: scale(0.8);
      transition: transform var(--breath-duration, 5s) ease-in-out,
                  opacity var(--breath-duration, 5s) ease-in-out;
    }

    .breathe-circle.inhale {
      opacity: 1;
      transform: scale(1.2);
    }

    .breathe-text {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--color-light);
    }

    /* ========================================
       SENSE MODE
       ======================================== */
    .sense-prompt {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.8;
      padding: 0 var(--spacing-md);
      animation: pulseFade 2s ease-in-out infinite;
    }

    @keyframes pulseFade {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ========================================
       REFLECT MODE
       ======================================== */
    .reflect-container {
      width: 100%;
      max-width: 400px;
      padding: 0 var(--spacing-sm);
    }

    .reflect-question {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.8;
      margin-bottom: var(--spacing-md);
    }

    .reflect-input {
      width: 100%;
      min-height: 150px;
      padding: 1.5rem;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      font-family: var(--font-primary);
      font-size: 1rem;
      line-height: 1.6;
      resize: none;
      background: transparent;
      color: var(--color-text);
      margin-bottom: var(--spacing-md);
      transition: var(--transition-fast);
    }

    .reflect-input::placeholder {
      color: var(--color-light);
      font-style: italic;
    }

    .reflect-input:focus {
      outline: 2px solid var(--color-accent-strong);
      outline-offset: 2px;
    }

    .button-group {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-sm);
    }

    .button-group button {
      flex: 1;
      /* Weniger seitliches Padding, sonst passen beide Buttons auf schmalen Screens nicht nebeneinander */
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .char-count {
      font-size: 0.8rem;
      color: var(--color-light);
      text-align: right;
    }

    /* ========================================
       NOTIFICATION
       ======================================== */
    .notification {
      position: fixed;
      bottom: calc(var(--spacing-md) + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-accent-fill);
      color: var(--color-text);
      padding: 1rem 2rem;
      border-radius: 2px;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      pointer-events: none;
    }

    .notification.show {
      opacity: 1;
    }

    /* ========================================
       UTILITY CLASSES
       ======================================== */
    .hidden {
      display: none !important;
    }

    /* Screen Reader Only - für barrierefreie Texte */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ========================================
       ACCESSIBILITY - Reduced Motion
       ======================================== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .ma-character {
        animation: none;
        opacity: 0.7;
      }

      .sense-prompt {
        animation: none;
        opacity: 1;
      }
    }

    /* ========================================
       DARK MODE
       ======================================== */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #1a1a1a;
        --color-accent: #8B7355;
        --color-accent-fill: #66533C;
        --color-accent-strong: #8B7355;
        --color-text: #E8E4DF;
        --color-subtle: #333333;
        --color-border: #707070;
        --color-light: #888888;
      }

      @media (hover: hover) {
        .btn-primary:hover {
          box-shadow: 0 10px 20px rgba(139, 115, 85, 0.3);
        }
      }
    }

    /* ========================================
       RESPONSIVE - Mobile Optimierung
       ======================================== */
    @media (max-width: 480px) {
      .app-container {
        padding: calc(var(--spacing-sm) + var(--safe-top)) calc(var(--spacing-sm) + var(--safe-right))
                 calc(var(--spacing-sm) + var(--safe-bottom)) calc(var(--spacing-sm) + var(--safe-left));
      }
      
      .ma-character {
        height: 87px;
        margin-bottom: var(--spacing-lg);
      }
      
      .reflect-question {
        font-size: 1.3rem;
      }
      
      .sense-prompt {
        font-size: 1.5rem;
      }
      
      .btn-primary {
        padding: 0.875rem 2.5rem;
        font-size: 0.9rem;
      }
      
      .corner-button {
        top: calc(var(--spacing-xs) + var(--safe-top));
        right: calc(var(--spacing-xs) + var(--safe-right));
      }
    }

    @media (max-width: 360px) {
      .app-container {
        padding: calc(0.75rem + var(--safe-top)) calc(0.75rem + var(--safe-right))
                 calc(0.75rem + var(--safe-bottom)) calc(0.75rem + var(--safe-left));
      }
      
      .reflect-container {
        padding: 0 0.5rem;
      }
      
      .ma-character {
        height: 69px;
      }
    }
  </style>
</head>
<body>
  
  <!-- App Container -->
  <main class="app-container">

    <!-- Export Button (nur im Idle sichtbar) -->
    <button class="corner-button" id="exportBtn"
            aria-label="Reflexionen exportieren"
            title="Reflexionen exportieren">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    </button>

    <!-- Beenden Button (nur während Breathe/Sense sichtbar; Reflect hat "Überspringen") -->
    <button class="corner-button hidden" id="cancelBtn"
            aria-label="Pause beenden"
            title="Pause beenden">×</button>

    <!-- ========================================
         IDLE SCREEN
         Default state, entry point
         ======================================== -->
    <div class="screen active" id="idleScreen" role="region" aria-label="Startbildschirm" tabindex="-1">
      <!-- 間 als Pfad – Quelle: icons/ma-glyph.svg (bei Änderung beide anpassen) -->
      <svg class="ma-character" viewBox="97 371 812 865" aria-hidden="true" focusable="false"><path d="M339 981L339 940L659 940L659 981L339 981M338 829L338 787L681 787L681 1141L338 1141L338 1100L635 1100L635 829L338 829M315 1192L315 787L360 787L360 1192L315 1192M121 555L121 515L414 515L414 555L121 555M580 555L580 515L881 515L881 555L580 555M860 1160L860 371L909 371L909 1160Q909 1189 900.5 1203.5Q892 1218 871 1225Q850 1232 811 1233Q772 1234 710 1234Q709 1227 706 1218Q703 1209 699.5 1200Q696 1191 692 1183Q725 1185 754.5 1185Q784 1185 806 1184.5Q828 1184 837 1184Q850 1183 855 1178Q860 1173 860 1160M124 412L124 371L447 371L447 703L124 703L124 663L401 663L401 412L124 412M550 371L882 371L882 412L597 412L597 663L882 663L882 704L550 704L550 371M97 1236L97 371L145 371L145 1236"/></svg>
      <button class="btn-primary" id="pauseBtn" aria-describedby="pause-description">Pause</button>
      <span id="pause-description" class="sr-only">Startet eine achtsame Pause basierend auf der Tageszeit</span>
    </div>

    <!-- ========================================
         BREATHE SCREEN
         Morning mode - breathing exercise
         ======================================== -->
    <div class="screen" id="breatheScreen" role="region" aria-label="Atemübung" tabindex="-1">
      <div class="breathe-circle" id="breatheCircle" aria-hidden="true"></div>
      <div class="breathe-text" id="breatheText" aria-live="polite" role="status">einatmen...</div>
    </div>

    <!-- ========================================
         SENSE SCREEN
         Midday mode - 5 senses awareness
         ======================================== -->
    <div class="screen" id="senseScreen" role="region" aria-label="Sinneswahrnehmung" tabindex="-1">
      <div class="sense-prompt" id="sensePrompt" aria-live="polite" role="status"></div>
    </div>

    <!-- ========================================
         REFLECT SCREEN
         Evening mode - reflection with optional journaling
         ======================================== -->
    <div class="screen" id="reflectScreen" role="region" aria-label="Reflexion" tabindex="-1">
      <div class="reflect-container">
        <label for="reflectInput" class="reflect-question">Deine Gedanken</label>
        <textarea
          class="reflect-input"
          id="reflectInput"
          placeholder="(optional)"
          maxlength="280"
          aria-describedby="char-count-info"
        ></textarea>
        <div class="button-group">
          <button class="btn-secondary" id="skipBtn" aria-label="Reflexion überspringen">Überspringen</button>
          <button class="btn-primary" id="finishBtn" aria-label="Reflexion speichern und beenden">Fertig</button>
        </div>
        <!-- Kein aria-live: würde bei jedem Tastendruck vorgelesen; per describedby beim Fokus -->
        <div class="char-count" id="char-count-info">
          <span id="charCount">0</span>/280 Zeichen
        </div>
      </div>
    </div>

  </main>

  <!-- Notification -->
  <div class="notification" id="notification" role="status" aria-live="polite"></div>

  <!-- ========================================
       JAVASCRIPT - Application Logic
       Modular aufgebaut für einfache Portierung
       ======================================== -->
  <script>
    // ========================================
    // CONFIG
    // Zeiten der Modi an einer Stelle
    // ========================================
    const Config = {
      BREATH_PHASE_MS: 5000,   // 5s ein / 5s aus = 6 Atemzüge pro Minute (Resonanzatmung)
      BREATH_CYCLES: 3,        // 3 Zyklen ≈ 30s
      SENSE_PROMPT_MS: 10000,  // 10s pro Sinnes-Prompt
      SENSE_OUTRO_MS: 3000     // Ausklang nach dem letzten Prompt
    };

    // ========================================
    // STATE MANAGEMENT
    // Zentraler App-State
    // ========================================
    const AppState = {
      currentMode: 'idle',
      breathPhase: 'in',
      breathCycleCount: 0,
      senseStepIndex: 0,
      reflectionText: '',
      
      // Rotierender Pool: pro Sinn eine Frage je Pause, Reihenfolge der Sinne fest.
      // Neue Fragen einfach ergänzen – kurz, offen, im Präsens, Du-Form.
      sensePool: [
        [ // Sehen
          "Was siehst du?",
          "Welche Farbe fällt dir gerade auf?",
          "Wohin fällt das Licht?",
          "Was liegt am Rand deines Blickfelds?"
        ],
        [ // Hören
          "Was hörst du?",
          "Was ist das leiseste Geräusch?",
          "Was hörst du in der Ferne?",
          "Was hörst du ganz in deiner Nähe?"
        ],
        [ // Fühlen
          "Was fühlst du auf deiner Haut?",
          "Wo berührt dein Körper den Boden?",
          "Ist die Luft warm oder kühl?",
          "Wie liegen deine Hände gerade?"
        ],
        [ // Riechen
          "Was riechst du?",
          "Wie riecht die Luft um dich?",
          "Atme durch die Nase ein. Was ist da?",
          "Riechst du etwas Vertrautes?"
        ],
        [ // Schmecken
          "Was schmeckst du?",
          "Welcher Geschmack ist noch in deinem Mund?",
          "Schmeckst du die Luft beim Einatmen?",
          "Wie fühlt sich dein Mund gerade an?"
        ]
      ],

      // Auswahl für die laufende Pause (wird in startSense() gezogen)
      sensePrompts: [],
      
      // Getter/Setter Pattern
      setState(newState) {
        Object.assign(this, newState);
      },
      
      reset() {
        this.currentMode = 'idle';
        this.breathPhase = 'in';
        this.breathCycleCount = 0;
        this.senseStepIndex = 0;
        this.reflectionText = '';
      }
    };

    // ========================================
    // STORAGE SERVICE
    // localStorage Wrapper, leicht zu erweitern (z.B. für API)
    // ========================================
    const StorageService = {
      STORAGE_KEY: 'ma_reflections',
      SENSE_KEY: 'ma_sense_last', // Indizes der zuletzt gezeigten Sinnes-Fragen (keine persönlichen Daten)

      getLastSensePicks() {
        try {
          const data = JSON.parse(localStorage.getItem(this.SENSE_KEY));
          return Array.isArray(data) ? data : [];
        } catch (error) {
          return [];
        }
      },

      saveSensePicks(picks) {
        try {
          localStorage.setItem(this.SENSE_KEY, JSON.stringify(picks));
        } catch (error) {
          // Nicht kritisch – dann kann sich eine Frage direkt wiederholen
        }
      },
      
      getReflections() {
        try {
          const data = localStorage.getItem(this.STORAGE_KEY);
          return data ? JSON.parse(data) : [];
        } catch (error) {
          console.error('Error loading reflections:', error);
          return [];
        }
      },
      
      saveReflection(text) {
        try {
          const reflections = this.getReflections();
          reflections.push({
            timestamp: new Date().toISOString(),
            text: text
          });
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(reflections));
          this.requestPersistence();
          return true;
        } catch (error) {
          console.error('Error saving reflection:', error);
          if (error.name === 'QuotaExceededError') {
            UIService.showNotification('Speicher voll. Bitte exportiere deine Reflexionen.');
          } else {
            UIService.showNotification('Fehler beim Speichern.');
          }
          return false;
        }
      },
      
      // Bittet den Browser, die Daten nicht automatisch zu löschen (z.B. Safari nach
      // 7 Tagen ohne Nutzung). Das Archiv ist unsichtbar – ein Verlust fiele sonst nie auf.
      // Erst nach dem ersten Speichern, weil Firefox dafür einen Dialog zeigt.
      async requestPersistence() {
        try {
          if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) {
            await navigator.storage.persist();
          }
        } catch (error) {
          // Nicht unterstützt – Daten bleiben trotzdem gespeichert, nur ohne Garantie
        }
      },

      exportAsMarkdown() {
        const reflections = this.getReflections();
        
        if (reflections.length === 0) {
          return null;
        }
        
        let markdown = '# 間 Ma - Reflexionen\n\n';
        
        reflections.forEach(r => {
          const date = new Date(r.timestamp);
          const dateStr = date.toLocaleDateString('de-DE', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
          markdown += `## ${dateStr}\n\n${r.text}\n\n---\n\n`;
        });
        
        return markdown;
      }
    };

    // ========================================
    // UI SERVICE
    // DOM Manipulation & Screen Management
    // ========================================
    const UIService = {
      screens: {
        idle: document.getElementById('idleScreen'),
        breathe: document.getElementById('breatheScreen'),
        sense: document.getElementById('senseScreen'),
        reflect: document.getElementById('reflectScreen')
      },
      
      elements: {
        pauseBtn: document.getElementById('pauseBtn'),
        exportBtn: document.getElementById('exportBtn'),
        cancelBtn: document.getElementById('cancelBtn'),
        breatheCircle: document.getElementById('breatheCircle'),
        breatheText: document.getElementById('breatheText'),
        sensePrompt: document.getElementById('sensePrompt'),
        reflectInput: document.getElementById('reflectInput'),
        skipBtn: document.getElementById('skipBtn'),
        finishBtn: document.getElementById('finishBtn'),
        charCount: document.getElementById('charCount'),
        notification: document.getElementById('notification')
      },
      
      showScreen(screenName) {
        // Hide all screens
        Object.values(this.screens).forEach(screen => {
          screen.classList.remove('active');
        });
        
        // Show target screen
        this.screens[screenName].classList.add('active');
        
        // Eck-Buttons: Export nur im Idle, Beenden nur während geführter Pausen
        const isGuided = screenName === 'breathe' || screenName === 'sense';
        this.elements.exportBtn.classList.toggle('hidden', screenName !== 'idle');
        this.elements.cancelBtn.classList.toggle('hidden', !isGuided);

        this.moveFocus(screenName);
      },

      // Fokus folgt dem Screen – sonst landet er auf einem ausgeblendeten Element
      moveFocus(screenName) {
        let target = this.screens[screenName];

        if (screenName === 'idle') {
          target = this.elements.pauseBtn;
        } else if (screenName === 'reflect' && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
          // Nur am Desktop direkt ins Textfeld – auf dem Handy würde sonst sofort
          // die Tastatur aufgehen, obwohl Schreiben optional ist
          target = this.elements.reflectInput;
        }

        target.focus({ preventScroll: true });
      },

      updateCharCount(count) {
        this.elements.charCount.textContent = count;
      },

      notificationTimer: null,

      showNotification(message, duration = 3000) {
        clearTimeout(this.notificationTimer);
        this.elements.notification.textContent = message;
        this.elements.notification.classList.add('show');

        this.notificationTimer = setTimeout(() => {
          this.elements.notification.classList.remove('show');
        }, duration);
      },
      
      // Lokales Datum (YYYY-MM-DD) – toISOString() wäre UTC und nach Mitternacht
      // (genau in der Reflect-Zeit) einen Tag zu früh
      localDateStamp(date = new Date()) {
        const pad = (n) => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      },

      // Mobil: System-Teilen-Dialog (Dateien, Mail, Notizen …) – ein Blob-Download
      // funktioniert in installierten Web-Apps auf iOS nicht zuverlässig.
      // Desktop: klassischer Download.
      // Rückgabe: 'shared' | 'downloaded' | 'cancelled'
      async shareOrDownload(content, filename) {
        if (window.matchMedia('(pointer: coarse)').matches && navigator.canShare) {
          // text/plain: text/markdown steht nicht auf der Teilen-Whitelist aller Browser
          const file = new File([content], filename, { type: 'text/plain' });
          if (navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: '間 Ma – Reflexionen' });
              return 'shared';
            } catch (error) {
              if (error.name === 'AbortError') {
                return 'cancelled';
              }
              // Andere Fehler → Download als Fallback
            }
          }
        }
        this.downloadFile(content, filename);
        return 'downloaded';
      },

      downloadFile(content, filename) {
        const blob = new Blob([content], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Verzögert freigeben – sofortiges revoke bricht den Download in manchen Browsern ab
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    };

    // ========================================
    // FEEDBACK SERVICE
    // Hilfen für Pausen mit geschlossenen Augen:
    // Bildschirm bleibt an, Vibration bei Atemwechsel, leiser Klang am Ende.
    // Alles optional – fehlt eine API, passiert einfach nichts.
    // ========================================
    const FeedbackService = {
      audioCtx: null,
      wakeLock: null,
      wakeLockWanted: false,

      // Muss im Klick-Handler laufen: Browser erlauben Audio nur nach einer Nutzer-Geste
      prepareAudio() {
        try {
          // iOS: 'ambient' respektiert den Stumm-Schalter
          if (navigator.audioSession) {
            navigator.audioSession.type = 'ambient';
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!this.audioCtx) {
            this.audioCtx = new AudioCtx();
          }
          if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
          }
        } catch (error) {
          this.audioCtx = null;
        }
      },

      // Leiser, synthetischer Klangschalen-Ton (keine Audio-Datei nötig)
      chime() {
        const ctx = this.audioCtx;
        if (!ctx || ctx.state !== 'running') return;

        const now = ctx.currentTime;
        const duration = 4;
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
        master.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        master.connect(ctx.destination);

        // Unharmonische Teiltöne wie bei einer Klangschale
        const base = 330;
        [[1, 1], [2.76, 0.35], [5.4, 0.12]].forEach(([ratio, level]) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = base * ratio;
          gain.gain.value = level;
          osc.connect(gain).connect(master);
          osc.start(now);
          osc.stop(now + duration);
        });
      },

      vibrate(pattern) {
        if (navigator.vibrate) {
          navigator.vibrate(pattern);
        }
      },

      async acquireWakeLock() {
        this.wakeLockWanted = true;
        if (!('wakeLock' in navigator) || this.wakeLock) return;
        try {
          const lock = await navigator.wakeLock.request('screen');
          // Pause wurde inzwischen beendet → sofort wieder freigeben
          if (!this.wakeLockWanted) {
            lock.release();
            return;
          }
          this.wakeLock = lock;
          lock.addEventListener('release', () => {
            if (this.wakeLock === lock) this.wakeLock = null;
          });
        } catch (error) {
          // z.B. Energiesparmodus – ohne Wake Lock weitermachen
        }
      },

      releaseWakeLock() {
        this.wakeLockWanted = false;
        if (this.wakeLock) {
          this.wakeLock.release().catch(() => {});
          this.wakeLock = null;
        }
      },

      // Der Browser gibt den Wake Lock beim Wechsel in den Hintergrund frei
      handleVisibilityChange() {
        if (document.visibilityState === 'visible' && this.wakeLockWanted) {
          this.acquireWakeLock();
        }
      }
    };

    // ========================================
    // MODE CONTROLLER
    // Logik für die verschiedenen Modi
    // ========================================
    const ModeController = {
      timers: [],
      
      clearTimers() {
        this.timers.forEach(timer => clearTimeout(timer));
        this.timers = [];
      },
      
      selectMode() {
        const hour = new Date().getHours();
        
        // Time-based mode selection
        if (hour >= 6 && hour < 10) {
          return 'breathe';
        } else if (hour >= 10 && hour < 18) {
          return 'sense';
        } else {
          return 'reflect';
        }
      },
      
      startPause() {
        const mode = this.selectMode();
        AppState.setState({ currentMode: mode });

        // Läuft noch innerhalb der Klick-Geste → Audio darf freigeschaltet werden
        FeedbackService.prepareAudio();

        switch(mode) {
          case 'breathe':
            FeedbackService.acquireWakeLock();
            this.startBreathe();
            break;
          case 'sense':
            FeedbackService.acquireWakeLock();
            this.startSense();
            break;
          case 'reflect':
            this.startReflect();
            break;
        }
      },

      // ========================================
      // BREATHE MODE LOGIC
      // ========================================
      startBreathe() {
        const { breatheCircle } = UIService.elements;
        breatheCircle.style.setProperty('--breath-duration', `${Config.BREATH_PHASE_MS}ms`);
        breatheCircle.classList.remove('inhale');

        UIService.showScreen('breathe');
        AppState.setState({ breathCycleCount: 0 });

        // Reflow erzwingen: Der Kreis war eben noch display:none. Ohne Reflow
        // würde die erste Einatmen-Transition übersprungen und der Kreis springen.
        void breatheCircle.offsetWidth;

        this.breatheCycle();
      },

      breatheCycle() {
        const { breatheCircle, breatheText } = UIService.elements;

        // Einatmen: ein kurzer Puls
        breatheCircle.classList.add('inhale');
        breatheText.textContent = 'einatmen...';
        FeedbackService.vibrate(40);

        this.timers.push(setTimeout(() => {
          // Ausatmen: zwei kurze Pulse
          breatheCircle.classList.remove('inhale');
          breatheText.textContent = 'ausatmen...';
          FeedbackService.vibrate([30, 120, 30]);

          this.timers.push(setTimeout(() => {
            AppState.breathCycleCount++;

            if (AppState.breathCycleCount < Config.BREATH_CYCLES) {
              this.breatheCycle();
            } else {
              this.completePause();
            }
          }, Config.BREATH_PHASE_MS));
        }, Config.BREATH_PHASE_MS));
      },
      
      // ========================================
      // SENSE MODE LOGIC
      // ========================================
      startSense() {
        UIService.showScreen('sense');
        AppState.setState({ senseStepIndex: 0, sensePrompts: this.pickSensePrompts() });
        this.showSensePrompt();
      },

      // Zieht pro Sinn eine zufällige Frage – nie dieselbe wie beim letzten Mal
      pickSensePrompts() {
        const last = StorageService.getLastSensePicks();

        const picks = AppState.sensePool.map((prompts, sense) => {
          const candidates = prompts
            .map((_, index) => index)
            .filter((index) => prompts.length === 1 || index !== last[sense]);
          return candidates[Math.floor(Math.random() * candidates.length)];
        });

        StorageService.saveSensePicks(picks);
        return picks.map((index, sense) => AppState.sensePool[sense][index]);
      },
      
      showSensePrompt() {
        const { sensePrompt } = UIService.elements;
        const { senseStepIndex, sensePrompts } = AppState;
        
        if (senseStepIndex < sensePrompts.length) {
          sensePrompt.textContent = sensePrompts[senseStepIndex];
          
          this.timers.push(setTimeout(() => {
            AppState.senseStepIndex++;
            this.showSensePrompt();
          }, Config.SENSE_PROMPT_MS));
        } else {
          // Ausklang
          sensePrompt.textContent = '...';
          this.timers.push(setTimeout(() => {
            this.completePause();
          }, Config.SENSE_OUTRO_MS));
        }
      },
      
      // ========================================
      // REFLECT MODE LOGIC
      // ========================================
      startReflect() {
        UIService.showScreen('reflect');
        UIService.elements.reflectInput.value = '';
        UIService.updateCharCount(0);
      },
      
      finishReflect(saveText = false) {
        if (saveText) {
          const text = UIService.elements.reflectInput.value.trim();
          if (text) {
            StorageService.saveReflection(text);
          }
        }
        this.endPause();
      },
      
      // ========================================
      // RETURN TO IDLE
      // ========================================

      // Natürliches Ende einer geführten Pause: Klang + Puls signalisieren "fertig"
      // (wichtig, wenn die Augen geschlossen sind)
      completePause() {
        FeedbackService.chime();
        FeedbackService.vibrate(200);
        this.endPause();
      },

      // Ende ohne Signal – auch beim Abbrechen per × oder Escape
      endPause() {
        this.clearTimers();
        FeedbackService.releaseWakeLock();
        AppState.reset();
        UIService.showScreen('idle');
      }
    };

    // ========================================
    // EVENT HANDLERS
    // ========================================
    const EventHandlers = {
      init() {
        // Pause button
        UIService.elements.pauseBtn.addEventListener('click', () => {
          ModeController.startPause();
        });
        
        // Export button
        UIService.elements.exportBtn.addEventListener('click', async () => {
          const markdown = StorageService.exportAsMarkdown();

          if (!markdown) {
            UIService.showNotification('Keine Einträge zum Exportieren');
            return;
          }

          const filename = `ma-reflections-${UIService.localDateStamp()}.md`;
          const result = await UIService.shareOrDownload(markdown, filename);

          if (result === 'shared') {
            UIService.showNotification('Reflexionen geteilt ✓');
          } else if (result === 'downloaded') {
            UIService.showNotification('Reflexionen exportiert ✓');
          }
        });
        
        // Reflect input character count
        UIService.elements.reflectInput.addEventListener('input', (e) => {
          UIService.updateCharCount(e.target.value.length);
        });
        
        // Skip button
        UIService.elements.skipBtn.addEventListener('click', () => {
          ModeController.finishReflect(false);
        });
        
        // Finish button
        UIService.elements.finishBtn.addEventListener('click', () => {
          ModeController.finishReflect(true);
        });
        
        // Beenden-Button (×) während Breathe/Sense
        UIService.elements.cancelBtn.addEventListener('click', () => {
          ModeController.endPause();
        });

        // Wake Lock nach Rückkehr aus dem Hintergrund erneuern
        document.addEventListener('visibilitychange', () => {
          FeedbackService.handleVisibilityChange();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
          // Escape to return to idle (only when not already in idle mode)
          if (e.key === 'Escape' && AppState.currentMode !== 'idle') {
            ModeController.endPause();
          }
        });
      }
    };

    // ========================================
    // APP INITIALIZATION
    // ========================================
    document.addEventListener('DOMContentLoaded', () => {
      EventHandlers.init();

      // Manifest-Shortcut "Pause starten" (./?action=pause): direkt in die Pause.
      // Ohne Nutzer-Geste blockieren Browser Ton und Vibration – Atemführung und Wake Lock laufen trotzdem.
      const params = new URLSearchParams(location.search);
      if (params.get('action') === 'pause') {
        history.replaceState(null, '', location.pathname);
        ModeController.startPause();
      }
    });

    // ========================================
    // PWA - Service Worker Registration
    // ========================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Relativer Pfad: funktioniert auch unter einem Unterpfad (z.B. /Ma-App/ auf GitHub Pages)
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('[PWA] Service Worker registered:', registration.scope);

            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available
                  UIService.showNotification('Neue Version verfügbar. Seite neu laden.', 5000);
                }
              });
            });
          })
          .catch((error) => {
            console.error('[PWA] Service Worker registration failed:', error);
          });
      });
    }
  </script>

</body>
</html>
